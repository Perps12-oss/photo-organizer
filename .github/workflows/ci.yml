name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest pytest-cov

      - name: Prefer headless OpenCV on Linux
        if: runner.os == 'Linux'
        run: pip install opencv-python-headless

      - name: Compile check
        run: python -m compileall -q -x archive app tests

      - name: Ruff F821 (undefined names)
        run: python -m ruff check app/file_utils.py app/fast_hash.py app/core --select F821

      - name: Bandit (high)
        run: bandit -r app/file_utils.py app/fast_hash.py app/core --severity-level high

      - name: Pytest
        run: python -m pytest -q --cov=app --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
